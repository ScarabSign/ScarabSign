# [sncast.default]                                         # Define a profile name
# url = "https://free-rpc.nethermind.io/sepolia-juno/v0_7" # Url of the RPC provider
# accounts-file = "../account-file"                        # Path to the file with the account data
# account = "mainuser"                                     # Account from `accounts-file` or default account file that will be used for the transactions
# keystore = "~/keystore"                                  # Path to the keystore file
# wait-params = { timeout = 300, retry-interval = 10 }     # Wait for submitted transaction parameters
# block-explorer = "StarkScan"                             # Block explorer service used to display links to transaction details
# show-explorer-links = true                               # Print links pointing to pages with transaction details in the chosen block explorer

[profile.devnet.account]
account_address = "0x034ba56f92265f0868c57d3fe72ecab144fc96f97954bbbc4252cef8e8a979ba"
private_key = "0x00000000000000000000000000000000b137668388dbe9acdfa3bc734cc2c469"
public_key = "0x05a5e37c60e77a0318643b111f88413a76af6233c891a0cfb2804106372006d4"

[profile.devnet]
url = "http://127.0.0.1:5050"

[sncast.devnet]
account = "devnet"
accounts-file = "$STARKNET_ACCOUNTS_FILE"
url = "http://127.0.0.1:5050"

[sncast.testnet]
account = "testnet"
accounts-file = "$STARKNET_ACCOUNTS_FILE"
url = "$RPC_URL"
max_fee = "0xFFFFFFFFFFFFFF"


[sncast.sepolia-test]
url = "$RPC_URL"
account = "testnet"
accounts-file = "$STARKNET_ACCOUNTS_FILE"
deployed_contracts = { ScarabSign = "0x0035cc91dcb3c458bb619c942225735e942616a9261fcc14ae12dc9d86e1c6ee", MockERC721 = "0x064f4cbef551b0d9eabf29439ce4bba23548b33f5d3d91dda35acc0ffe2a853e", MockERC20 = "0x05b726cfeaf1e97aa9e742ba910e38b2efa3d2bba4e48740c967e201b456d429" }
